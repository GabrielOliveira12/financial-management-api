<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <title>Financial Management — Login</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet" type="text/css">
    <link
        href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
        rel="stylesheet">
    <link href="css/sb-admin-2.min.css" rel="stylesheet">
    <style>
        .bg-login-image {
            background: linear-gradient(135deg, #4e73df 0%, #224abe 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .bg-login-image .login-icon {
            color: rgba(255, 255, 255, 0.9);
            text-align: center;
        }
        .bg-login-image .login-icon img {
            width: 100%;
            max-width: 320px;
        }
        .bg-login-image .login-icon p {
            margin-top: 1.5rem;
            font-size: 1.1rem;
            font-weight: 600;
        }
    </style>
</head>

<body class="bg-gradient-primary">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-xl-10 col-lg-12 col-md-9">
                <div class="card o-hidden border-0 shadow-lg my-5">
                    <div class="card-body p-0">
                        <div class="row no-gutters">
                            <div class="col-lg-6 d-none d-lg-flex bg-login-image">
                                <div class="login-icon">
                                    <img src="img/undraw_posting_photo.svg" alt="Financial Management">
                                    <p>Financial Management</p>
                                </div>
                            </div>
                            <div class="col-lg-6">
                                <div class="p-5">
                                    <div class="text-center">
                                        <h1 class="h4 text-gray-900 mb-4">Financial Management API</h1>
                                        <p class="mb-4 text-gray-600">Entre com seu usuário ou email</p>
                                    </div>

                                    <div id="alert-container"></div>

                                    <form class="user" id="login-form">
                                        <div class="form-group">
                                            <input type="text" class="form-control form-control-user"
                                                id="username" placeholder="Username ou email" required autofocus>
                                        </div>
                                        <div class="form-group">
                                            <input type="password" class="form-control form-control-user"
                                                id="password" placeholder="Senha" required>
                                        </div>
                                        <button type="submit" class="btn btn-primary btn-user btn-block">
                                            Entrar
                                        </button>
                                    </form>

                                    <hr>
                                    <div class="text-center">
                                        <a class="small" href="register.html">Criar uma conta</a>
                                    </div>
                                    <hr>
                                    <div class="text-center small text-gray-500">
                                        Usuários de demonstração: ana.silva / user1123
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.6.0/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-easing/1.4.1/jquery.easing.min.js"></script>
    <script src="js/sb-admin-2.min.js"></script>

    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <script>
        $(function () {
            if (Auth.isAuthenticated()) {
                window.location.href = "index.html";
                return;
            }

            $("#login-form").on("submit", function (event) {
                event.preventDefault();

                const username = $("#username").val().trim();
                const password = $("#password").val();

                Api.ms1("/auth/login", {
                    method: "POST",
                    body: JSON.stringify({ username: username, password: password })
                }).then(function (data) {
                    Auth.setSession(data.accessToken, username);
                    window.location.href = "index.html";
                }).catch(function (error) {
                    showAlert("alert-container", extractErrorMessage(error) || "Usuário ou senha inválidos.");
                });
            });
        });
    </script>

</body>

</html>
